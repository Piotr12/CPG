# Name of your application. Used to uniquely configure containers.
service: cpg

# Name of the container image.
image: cpg

# Deploy to these servers.
servers:
  web:
    - 146.59.105.8

# Persistent data: the SQLite database and every other file the app writes. The image sets
# DATA_DIR=/externaldata; the host directory must be writable by the container user (uid 1001).
volumes:
  - "/externaldata/cpg.baby:/externaldata"

# Runtime secrets, resolved from .kamal/secrets. The app refuses to start without the admin password.
env:
  secret:
    - CPG_ADMIN_PASSWORD

# kamal-proxy terminates TLS with a Let's Encrypt certificate for these hosts.
proxy:
  ssl: true
  # Never pass client-supplied X-Forwarded-* headers through: the sign-in throttle keys on the
  # client IP, which must come from kamal-proxy itself (already the default with ssl: true).
  forward_headers: false
  hosts:
    - cpg.baby
    - www.cpg.baby
  app_port: 3000
  healthcheck:
    path: /up

# Local registry: the image is pushed to a registry on the deploying machine and
# pulled by the server through the SSH tunnel, so no external registry is needed.
registry:
  server: localhost:5555

builder:
  arch: amd64

ssh:
  user: ubuntu

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
