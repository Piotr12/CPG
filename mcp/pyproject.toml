[project]
name = "cpg-mcp"
dynamic = ["version"]
description = "A local stdio MCP server that gives an agent CPG's API as tools."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.9",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "mcp>=2.3,<3",
  # The catalogue's patterns use Unicode property escapes (\p{L}), which Python's re can't compile.
  "regex>=2025.1",
]

[project.scripts]
cpg-mcp = "cpg_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "cpg_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["cpg_mcp"]

[dependency-groups]
dev = [
  "pip-audit>=2.9",
  "pyright>=1.1.400",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "respx>=0.23",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cpg_mcp"]

[tool.coverage.report]
# The repository's 100% rule (AGENTS.md), applied to Python. Don't lower it.
fail_under = 100
show_missing = true

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.pyright]
pythonVersion = "3.12"
include = ["cpg_mcp", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
