name: CI

# Every pull request, and every push to main before it deploys (deploy.yml calls this workflow).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs called from deploy.yml are keyed by
# commit, so they are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # Fails below 100% line/branch/function/statement coverage (vitest.config.mts).
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # Builds the production image, starts it with Testcontainers on an empty data directory and
  # drives it with agent-browser (tests/integration/).
  #
  # The browser install and the suite each get their own budget, and the job's covers both plus
  # setup (tests/ci-workflow.test.ts). The install usually takes 15 s, but `--with-deps` fetches
  # ~70 MB of fonts from Ubuntu's apt mirror, which has taken over 19 minutes (#167). A slow install
  # then fails its own step with a timeout instead of cancelling the suite halfway through.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome for agent-browser
        timeout-minutes: 10
        run: npx agent-browser install --with-deps
      - name: Run integration tests
        timeout-minutes: 20
        run: npm run test:integration
