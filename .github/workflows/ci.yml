name: CI

# Every pull request, and every push to main before it deploys (deploy.yml calls this workflow).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Runs called from deploy.yml are keyed by
# commit, so they are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  # The unit suite with coverage, split across parallel runners. Whole, it took 8.6 min on a quick runner
  # and over 10 on a slow one (the dataset seed and reset tests). The timing tests run apart, in
  # unit-timing. Each shard writes its results and raw coverage as a blob and skips the threshold, which
  # no single shard can reach; unit-coverage merges the blobs and enforces it. The limit keeps about twice
  # the whole suite's length (tests/ci-workflow.test.ts).
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npm run test:coverage -- --project=!timing --shard=${{ matrix.shard }}/${{ strategy.job-total }}
          --coverage.thresholds.100=false --reporter=default --reporter=blob
          --outputFile.blob=blob-reports/blob-${{ matrix.shard }}.json
      # A shard whose tests fail still uploads its blob, so the merge reports every failure.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-blob-${{ matrix.shard }}
          path: blob-reports/
          if-no-files-found: error
          retention-days: 1

  # The tests that bound how long the code takes (the timing project, vitest.config.mts), on a runner of
  # their own and one file at a time. Beside the rest of the suite the MRP timing test went over its CI
  # bound on unchanged code, because the bound measured the runner's other test files too (#337). Its
  # blob joins the shards' in unit-coverage.
  unit-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: >-
          npm run test:coverage -- --project=timing --no-file-parallelism
          --coverage.thresholds.100=false --reporter=default --reporter=blob
          --outputFile.blob=blob-reports/blob-timing.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-blob-timing
          path: blob-reports/
          if-no-files-found: error
          retention-days: 1

  # Fails below 100% line/branch/function/statement coverage (vitest.config.mts) over every shard's and
  # the timing tests' coverage, and on any test they failed. It runs even when one of them failed, so a red
  # job can't leave it skipped: a missing blob drops coverage below the threshold.
  unit-coverage:
    needs: [unit-tests, unit-timing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: unit-blob-*
          path: blob-reports/
          merge-multiple: true
      - run: npm run test:coverage -- --merge-reports=blob-reports

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  # Builds the production image, starts it with Testcontainers on an empty data directory and
  # drives it with agent-browser (tests/integration/).
  #
  # The browser install and the suite each get their own budget, and the job's covers both plus
  # setup (tests/ci-workflow.test.ts). The install only downloads Chrome: the runner image already
  # has Chrome's libraries, and `--with-deps` also fetched ~70 MB of fonts from Ubuntu's apt mirror,
  # which has stalled for 9 to over 19 minutes (#167, and two of four shards on #171).
  #
  # The files run one at a time against one app, so the suite is split across parallel runners, each
  # with its own image and app. Every shard runs to the end, so one failing shard doesn't hide the
  # others' results.
  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Chrome for agent-browser
        timeout-minutes: 10
        run: npx agent-browser install
      - name: Run integration tests
        timeout-minutes: 20
        run: npm run test:integration -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}
