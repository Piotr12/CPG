name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAMAL_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Kamal
        run: gem install kamal -v "$KAMAL_VERSION" --no-document

      - uses: docker/setup-buildx-action@v3

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned (not ssh-keyscan'd) so a spoofed host can't be trusted on first use.
      # Plain, unhashed entry: net-ssh failed to match hashed ones.
      - name: Trust server host key
        run: echo "146.59.105.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOqaLxYJYe/jp8ZQih5EJzUUJ8BMClWWtIM6IgDwt2Fb" >> ~/.ssh/known_hosts

      - name: Deploy
        run: kamal deploy
