name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub keeps one pending run per group and cancels the older one when another is queued. A run on a ref other
# than main, which only fails below, gets a group of its own, so it can't cancel a main deploy waiting here (#360).
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-production' || format('deploy-refused-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A commit that holds the active copy of a spec already implemented or archived fails tests/ai-filenames.test.ts.
  # spec-copies.yml deletes that copy on main and starts this workflow again, so this run skips CI and the deploy
  # (#351). The deletion here stays on this job's own checkout.
  spec-copies:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      copies: ${{ steps.check.outputs.copies }}
    steps:
      # A hand-started run (workflow_dispatch) may name any branch or tag. Only main deploys (#360). The ref is read
      # from the environment, never pasted into the script by an expression: a branch name must not become shell code.
      - name: Refuse a ref other than main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploy ships main only. This run was started on $GITHUB_REF; start it on main."
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: check
        run: |
          set -euo pipefail
          copies="$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/delete-spec-copies.ts .ai/specs | tr '\n' ' ')"
          echo "copies=$copies" >> "$GITHUB_OUTPUT"
          if [ -n "$copies" ]; then echo "Skipping CI and the deploy: spec-copies.yml deletes $copies"; fi

  # The same checks as on pull requests: lint, typecheck, unit tests, build, integration tests.
  ci:
    needs: spec-copies
    if: needs.spec-copies.outputs.copies == ''
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    # The job that holds the secrets states the rule itself, whatever later becomes of `needs` (#360).
    if: github.ref == 'refs/heads/main'
    # The deploy secrets live in this environment, and its branch rule lets only main use it. GitHub enforces the
    # rule itself, so a branch's own copy of this file can't reach the secrets either (#368).
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAMAL_VERSION: 2.11.0
    steps:
      - uses: actions/checkout@v5

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Kamal
        run: gem install kamal -v "$KAMAL_VERSION" --no-document

      - uses: docker/setup-buildx-action@v3

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Pinned (not ssh-keyscan'd) so a spoofed host can't be trusted on first use.
      # Plain, unhashed entry: net-ssh failed to match hashed ones.
      - name: Trust server host key
        run: echo "146.59.105.8 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOqaLxYJYe/jp8ZQih5EJzUUJ8BMClWWtIM6IgDwt2Fb" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          CPG_ADMIN_PASSWORD: ${{ secrets.CPG_ADMIN_PASSWORD }}
        run: kamal deploy
