<!doctype html><html lang="en" class=""><head><meta charset="utf-8"><title>mockup</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%}
:root{--bg:oklch(1 0 0);--fg:oklch(.145 0 0);--card:oklch(1 0 0);--muted:oklch(.556 0 0);--border:oklch(.922 0 0);--sec:oklch(.97 0 0);--pri:oklch(.205 0 0);--prifg:oklch(.985 0 0)}
.dark{--bg:oklch(.145 0 0);--fg:oklch(.985 0 0);--card:oklch(.205 0 0);--muted:oklch(.708 0 0);--border:oklch(1 0 0/10%);--sec:oklch(.269 0 0);--pri:oklch(.922 0 0);--prifg:oklch(.205 0 0);color-scheme:dark}
body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;min-height:100%;font-size:14px}
.topbar{display:flex;justify-content:flex-end;padding:12px 24px}.topbar a{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
main{width:100%;max-width:768px;margin:0 auto;padding:24px;flex:1;display:flex;flex-direction:column;gap:24px}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0}h2{font-size:16px;margin:0 0 6px}
.acct{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--muted);flex-wrap:wrap}.acct strong{color:var(--fg)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}.seg button{border:0;background:transparent;color:var(--fg);padding:4px 10px;font:inherit;font-size:13px}
.seg button[aria-pressed=true]{background:var(--sec);font-weight:600}.seg button+button{border-left:1px solid var(--border)}
.btn{border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px}
.btn.pri{background:var(--pri);color:var(--prifg);border-color:var(--pri)}
.card{background:var(--card);border-radius:12px;box-shadow:0 0 0 1px color-mix(in oklch,var(--fg) 10%,transparent);padding:16px;display:flex;flex-direction:column;gap:12px}
.mono{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:12px}.badge.s{background:var(--sec);border-color:transparent}
.search{display:flex;gap:8px}.search input{flex:1;border:1px solid var(--border);background:transparent;color:var(--fg);border-radius:8px;padding:6px 10px;font:inherit}
.topic{border-top:1px solid var(--border);padding-top:16px}.topic p{margin:0 0 8px;line-height:1.5}.meta{color:var(--muted);font-size:12px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:16px 24px 24px}footer a{color:inherit;text-decoration:underline;text-underline-offset:3px}
.note{position:fixed;left:8px;bottom:8px;font-size:11px;color:var(--muted);opacity:.7}
</style></head><body><div class="topbar"><a href="#">Help</a></div><main><div class="acct"><span>Signed in as <strong>admin</strong></span>
<span class="seg" role="group" aria-label="Language"><button aria-pressed="true">English</button><button aria-pressed="false">Polski</button></span>
<span class="seg" role="group" aria-label="Theme"><button aria-pressed="true">Light</button><button aria-pressed="false">Dark</button></span>
<button class="btn">Sign out</button></div>
<h1>Cave control</h1>
<div class="card"><h2>Database</h2><div class="mono">/externaldata/cpg.sqlite</div>
<div class="badges"><span class="badge s">3 migrations applied</span><span class="badge">0 pending</span><span class="badge">0 settings</span></div></div></main><footer>Caveman Planning Good! Made in Jozefoslaw with Tokens, Coffee and <a href="https://github.com/open-mercato/skills">OpenMercato Skills</a> during <a href="https://www.aitechleaders.pl/">AITechLeaders training</a>.</footer><div class="note">Mockup — /admin, English, light (illustrative, not app code)</div></body></html>
