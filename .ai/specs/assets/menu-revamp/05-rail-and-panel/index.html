<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPG menu revamp — 05 Icon rail + contextual panel</title>
<style>
/* ---------- tokens (shadcn neutral, like the current app) ---------- */
:root{
  --bg:#fff;--fg:#252525;--muted:#737373;--border:#e5e5e5;--subtle:#fafafa;--card:#fff;--hover:#f4f4f5;
  --primary:#252525;--primary-fg:#fff;--ring:#2563eb;--danger:#c0362c;--ok-bg:#f4f4f5;
  --panel:#fafafa;--shadow:0 12px 32px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);
  --t-bg:#fde68a;--t-fg:#92400e;--t-edge:#f59e0b;--t-hover:rgba(146,64,14,.12);--t-on:rgba(146,64,14,.18);
  --p-bg:#171717;--p-fg:#a3a3a3;--p-edge:#dc2626;--p-hover:rgba(255,255,255,.08);--p-on:rgba(255,255,255,.14);
  --g-bg:#f4f4f5;--g-fg:#525252;
  --ro-bg:#fef2f2;--ro-border:#fecaca;--ro-fg:#991b1b;
}
[data-theme=dark]{
  --bg:#0a0a0a;--fg:#ededed;--muted:#a1a1a1;--border:#2a2a2a;--subtle:#141414;--card:#111;--hover:#1f1f1f;
  --primary:#ededed;--primary-fg:#111;--ring:#60a5fa;--ok-bg:#1f1f1f;--panel:#111;--shadow:0 12px 32px rgba(0,0,0,.6);
  --t-bg:#92400e;--t-fg:#fde68a;--t-edge:#f59e0b;--t-hover:rgba(253,230,138,.12);--t-on:rgba(253,230,138,.2);
  --p-bg:#000;--p-fg:#a3a3a3;
  --g-bg:#1a1a1a;--g-fg:#a3a3a3;
  --ro-bg:#2a0e0e;--ro-border:#7f1d1d;--ro-fg:#fca5a5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.s{width:16px;height:16px}

/* ---------- shell ---------- */
.app{display:flex;min-height:100vh}
.maincol{flex:1;min-width:0;display:flex;flex-direction:column}

/* ---------- rail ---------- */
.rail{position:sticky;top:0;height:100vh;width:64px;flex:none;display:flex;flex-direction:column;align-items:center;padding:10px 0 10px;gap:2px;z-index:30}
.app[data-ctx=test] .rail{background:var(--t-bg);color:var(--t-fg);box-shadow:inset -1px 0 0 var(--t-edge)}
.app[data-ctx=prod] .rail{background:var(--p-bg);color:var(--p-fg);box-shadow:inset -3px 0 0 var(--p-edge)}
.app[data-ctx=global] .rail{background:var(--g-bg);color:var(--g-fg);box-shadow:inset -1px 0 0 var(--border)}
.tswitch{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:6px}
.tchip{display:flex;padding:2px;gap:2px;border-radius:9px;background:rgba(0,0,0,.09)}
.app[data-ctx=prod] .tchip{background:rgba(255,255,255,.1)}
.tchip button{position:relative;width:24px;height:26px;border:0;border-radius:7px;background:transparent;font-weight:700;font-size:12px;cursor:pointer;color:inherit;opacity:.75}
.tchip button:hover{opacity:1;background:rgba(127,127,127,.18)}
.tchip button[aria-pressed=true]{opacity:1}
.tchip button[data-t=test][aria-pressed=true]{background:#92400e;color:#fff}
.tchip button[data-t=prod][aria-pressed=true]{background:#dc2626;color:#fff}
.lk{position:absolute;bottom:-7px;right:-7px;font-size:10px;line-height:1;background:var(--bg);border-radius:6px;padding:1px;box-shadow:0 0 0 1px var(--border)}
.tword{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
[data-tip]{position:relative}
[data-tip]:hover::after,[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);background:#171717;color:#fff;font-size:12px;font-weight:500;line-height:1.35;padding:6px 9px;border-radius:7px;white-space:nowrap;z-index:80;pointer-events:none;text-transform:none;letter-spacing:0}
.rsep{width:32px;height:1px;background:currentColor;opacity:.2;margin:4px 0 6px}
.rspacer{flex:1}
.ritem{position:relative;width:60px;min-height:52px;border:0;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 0;font-size:10.5px;line-height:1.15;text-align:center;cursor:pointer;color:inherit;text-decoration:none}
.ritem .rl{max-width:60px;letter-spacing:-.01em}
html[lang=pl] .ritem .rl{font-size:9.5px}
.app[data-ctx=test] .ritem:hover{background:var(--t-hover)}
.app[data-ctx=prod] .ritem:hover{background:var(--p-hover);color:#fff}
.app[data-ctx=global] .ritem:hover{background:rgba(0,0,0,.06)}
[data-theme=dark] .app[data-ctx=global] .ritem:hover{background:rgba(255,255,255,.08)}
.ritem[aria-expanded=true],.ritem.here{font-weight:600}
.app[data-ctx=test] .ritem[aria-expanded=true]{background:var(--t-on)}
.app[data-ctx=prod] .ritem[aria-expanded=true]{background:var(--p-on);color:#fff}
.app[data-ctx=global] .ritem[aria-expanded=true]{background:rgba(0,0,0,.08)}
[data-theme=dark] .app[data-ctx=global] .ritem[aria-expanded=true]{background:rgba(255,255,255,.1)}
.app[data-ctx=prod] .ritem.here{color:#fff}
.ritem.here::before{content:"";position:absolute;left:-2px;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:currentColor}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:currentColor}
.av b{color:var(--bg);font-weight:700}
.app[data-ctx=test] .av b{color:var(--t-bg)}
.app[data-ctx=prod] .av b{color:var(--p-bg)}

/* ---------- contextual panel ---------- */
.panel{position:sticky;top:0;height:100vh;width:240px;flex:none;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:25}
.app:not(.pinned):not(.overlay) .panel{display:none}
.app.overlay .panel{position:fixed;left:64px;top:0;bottom:0;height:auto;box-shadow:var(--shadow);animation:slide .12s ease-out}
@keyframes slide{from{transform:translateX(-8px)}to{transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:14px 12px 8px 16px}
.ptitle{font-weight:600;font-size:15px}
.psub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.test{background:#f59e0b}.dot.prod{background:#dc2626}.dot.global{background:#a3a3a3}
.iconbtn{width:30px;height:30px;border:1px solid transparent;border-radius:8px;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--hover);color:var(--fg)}
.pfilter{margin:2px 12px 8px;position:relative}
.pfilter svg{position:absolute;left:9px;top:8px;color:var(--muted)}
.pfilter input{width:100%;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);padding:0 30px 0 30px;font:inherit;font-size:13px}
.pfilter input::-webkit-search-cancel-button{display:none}
.pfilter kbd{position:absolute;right:8px;top:7px;font:11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.ptree{flex:1;overflow:auto;padding:0 8px 16px}
.tgroup{margin-bottom:10px}
.gtitle{font-size:11.5px;font-weight:600;color:var(--muted);padding:8px 8px 4px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.04em}
.ptree ul{list-style:none;margin:0;padding:0}
.ptree li.sep{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.titem{display:flex;align-items:center;gap:8px;min-height:32px;padding:5px 8px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:13.5px}
.titem:hover{background:var(--hover)}
.titem[aria-current]{background:var(--hover);font-weight:600}
.titem[aria-current=page]{box-shadow:inset 2px 0 0 var(--fg)}
.titem .tl{flex:1;min-width:0}
.titem .cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.titem.later{color:var(--muted)}
.titem .chev{color:var(--muted)}
.badge-later{font-size:10.5px;border:1px dashed var(--border);color:var(--muted);border-radius:999px;padding:0 6px;font-weight:500;white-space:nowrap}
.badge-admin{font-size:10.5px;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:0 6px;white-space:nowrap}
.pnote{font-size:12px;color:var(--muted);padding:6px 8px;line-height:1.45}
.pnote a{text-underline-offset:2px}
.empty{color:var(--muted);font-size:13px;padding:8px}
.pfoot{border-top:1px solid var(--border);padding:8px 12px;font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pfoot kbd{font:11px ui-monospace,monospace;border:1px solid var(--border);border-radius:4px;padding:0 4px}

/* ---------- top header ---------- */
.topbar{position:sticky;top:0;z-index:20;height:52px;display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.brand{font-weight:700;text-decoration:none;white-space:nowrap}
.tpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:6px;white-space:nowrap}
.tpill.test{background:#92400e;color:#fff}
.tpill.prod{background:#171717;color:#fff;box-shadow:inset 0 0 0 1px #dc2626}
.tpill.global{background:var(--hover);color:var(--fg);box-shadow:inset 0 0 0 1px var(--border)}
.crumbs{color:var(--muted);display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--fg);font-weight:500}
.tdesc{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap}
.mchip{display:none}

/* ---------- banners & page ---------- */
.robanner{display:flex;align-items:center;gap:10px;padding:10px 24px;background:var(--ro-bg);color:var(--ro-fg);border-bottom:1px solid var(--ro-border);font-size:13.5px}
.robanner a{margin-left:auto;white-space:nowrap}
main{width:100%;max-width:980px;margin:0 auto;padding:28px 32px 40px;display:flex;flex-direction:column;gap:16px;flex:1}
.bc{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.bc a{color:var(--muted);text-underline-offset:3px}
.h1row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
h1{font-size:24px;margin:0;line-height:1.25;outline:none}
h2{font-size:17px;margin:8px 0 0}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.muted{color:var(--muted);margin:0}
.btn{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px;background:var(--bg);white-space:nowrap;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.primary:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:28px;padding:0 9px;font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--subtle)}
td{padding:10px 12px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.link{text-decoration:underline;text-underline-offset:3px}
.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:1px 8px;font-size:12px;white-space:nowrap}
.badge.ok{background:var(--ok-bg)}
.badge.bad{background:var(--danger);color:#fff;border-color:var(--danger)}
.card{border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--card)}
dl.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
dl.facts dt{color:var(--muted);font-size:13px}
dl.facts dd{margin:4px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.stat{display:block;border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-decoration:none;background:var(--card)}
.stat:hover{background:var(--hover)}
.stat .n{font-size:22px;font-weight:650;font-variant-numeric:tabular-nums}
.stat .l{color:var(--muted);font-size:13px}
.note{border:1px dashed var(--border);border-radius:12px;padding:10px 14px;color:var(--muted);font-size:13.5px;display:flex;gap:10px;align-items:center}
.ph-later{border:1px dashed var(--border);border-radius:14px;padding:36px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.ph-later .big{font-size:40px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.steps li{border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.steps .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid var(--border)}
.steps li.on .num{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.drop{border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:13px}
.switch{width:40px;height:22px;border-radius:999px;border:0;background:#d4d4d4;position:relative;cursor:pointer;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .12s}
.switch[aria-checked=true]{background:#dc2626}
.switch[aria-checked=true]::after{left:21px}
.trow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--border)}
.tenants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.tcard-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.help h2{font-size:16px}
.help p{margin:4px 0}
footer.foot{text-align:center;color:var(--muted);font-size:13px;padding:20px 24px 24px}
footer.foot a{color:var(--muted);text-underline-offset:3px}

/* ---------- popovers / dialogs / toast ---------- */
.popover{position:fixed;left:72px;bottom:12px;width:268px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:12px;z-index:70;display:flex;flex-direction:column;gap:10px}
.popover[hidden]{display:none}
.who{display:flex;gap:10px;align-items:center}
.who .av2{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-fg);font-weight:700}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:4px 8px;cursor:pointer;font-size:13px}
.seg button[aria-pressed=true]{background:var(--hover);font-weight:600}
.prow{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.mitem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;text-decoration:none;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;font-size:14px}
.mitem:hover{background:var(--hover)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim[hidden]{display:none}
.dlg{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--card);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:10px}
.dlg>*{flex-shrink:0}
.dlg h2{margin:0;font-size:19px}
.dlg h3{margin:10px 0 0;font-size:14.5px}
.dlg p,.dlg ul{margin:0}
.dlg ul{padding-left:18px}
.dlg table{font-size:13px}
.dlg td,.dlg th{padding:6px 8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#171717;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:95;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
#toast[hidden]{display:none}

/* ---------- mockup controls ---------- */
.mc{position:fixed;right:12px;bottom:12px;z-index:85;width:236px;background:var(--card);border:1.5px dashed #a3a3a3;border-radius:12px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.mc.closed{width:auto}
.mc-h{width:100%;border:0;background:transparent;padding:8px 10px;text-align:left;font-weight:600;font-size:12px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;color:var(--muted)}
.mc-b{padding:0 10px 10px;display:flex;flex-direction:column;gap:7px}
.mc-b[hidden]{display:none}
.mc fieldset{border:0;padding:0;margin:0;display:flex;gap:10px;flex-wrap:wrap}
.mc legend{font-weight:600;padding:0;margin-bottom:3px}
.mc label{display:flex;gap:6px;align-items:center;cursor:pointer}
.mc .btn{height:28px;font-size:12.5px;justify-content:center}

/* ---------- mobile ---------- */
.tabbar,.sheet{display:none}
@media (max-width:767px){
  .rail,.panel{display:none!important}
  .topbar{height:52px;padding:0 12px;gap:10px;border-bottom:0}
  .app[data-ctx=test] .topbar{background:var(--t-bg);color:var(--t-fg);box-shadow:inset 0 -1px 0 var(--t-edge)}
  .app[data-ctx=prod] .topbar{background:var(--p-bg);color:#fff;box-shadow:inset 0 -3px 0 var(--p-edge)}
  .app[data-ctx=global] .topbar{background:var(--g-bg);color:var(--fg);box-shadow:inset 0 -1px 0 var(--border)}
  .topbar .tpill,.topbar .crumbs,.topbar .tdesc{display:none}
  .mchip{display:flex;margin-left:auto;padding:2px;gap:2px;border-radius:10px;background:rgba(0,0,0,.09)}
  .app[data-ctx=prod] .mchip{background:rgba(255,255,255,.12)}
  .mchip button{position:relative;border:0;background:transparent;border-radius:8px;height:32px;padding:0 12px;font-weight:600;font-size:13px;cursor:pointer;color:inherit}
  .mchip button[data-t=test][aria-pressed=true]{background:#92400e;color:#fff}
  .mchip button[data-t=prod][aria-pressed=true]{background:#dc2626;color:#fff}
  .mchip .lk{position:static;box-shadow:none;background:transparent;margin-left:3px}
  .robanner{padding:9px 14px;font-size:13px;flex-wrap:wrap}
  .robanner a{margin-left:0}
  main{padding:18px 14px 24px}
  h1{font-size:21px}
  dl.facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps,.tenants{grid-template-columns:1fr}
  footer.foot{padding-bottom:84px}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:50;height:62px;background:var(--bg);border-top:1px solid var(--border);grid-auto-flow:column;grid-auto-columns:1fr;padding-bottom:env(safe-area-inset-bottom)}
  .tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);cursor:pointer;position:relative;min-width:0}
  .tab{padding:0 3px}
  .tab .rl{max-width:100%;text-align:center;line-height:1.1}
  html[lang=pl] .tab .rl{font-size:10px}
  td{white-space:nowrap}
  .tab.here,.tab[aria-expanded=true]{color:var(--fg);font-weight:600}
  .tab.here::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--fg)}
  .sheet{display:flex;flex-direction:column;position:fixed;left:0;right:0;top:52px;bottom:62px;z-index:45;background:var(--bg);overflow:auto}
  .sheet[hidden]{display:none}
  .sheet .ph{padding:14px 14px 6px 16px;border-bottom:0}
  .sheet .ptitle{font-size:19px}
  .sheet .pfilter{margin:4px 14px 10px}
  .sheet .pfilter input{height:40px;font-size:15px}
  .sheet .pfilter svg{top:12px}
  .sheet .pfilter kbd{display:none}
  .sheet .ptree{padding:0 10px 16px;overflow:visible}
  .sheet .titem{min-height:48px;font-size:15.5px;padding:8px 10px}
  .sheet .gtitle{font-size:12px}
  .popover{left:12px;right:12px;width:auto;bottom:74px}
  .mc{bottom:72px;right:8px;width:212px}
  .mc.closed .mc-x{display:none}
  #toast{bottom:76px}

/* ================= routing ================= */
function parse(){

}
function areaOf(r, sc){

function tree(area){
  var admin = S.role === "admin";
  switch (area) {
    case "home":
      var rec = S.recent.filter(function(x){ return x.href !== tHref("overview"); }).slice(0, 6).map(function(x){ return {label:x.label, href:x.href, id:"r:"+x.href, tag:x.tag, raw:true}; });

        {items:[tItem("overview", {label:"Overview"})]},
        {title:"Recent", items:rec, emptyNote:"Screens you open appear here."}
      ];
    case "master":
      return [{items: keysOf("master").map(function(k){ return tItem(k); })}];
    case "ops":
      return ["Sales","Purchasing","Production","Inventory"].map(function(g){ return {title:g, later:2, items: keysOf("ops", g).map(function(k){ return tItem(k); })}; });
    case "planning": return [{items: keysOf("planning").map(function(k){ return tItem(k); })}];
    case "reports":  return [{items: keysOf("reports").map(function(k){ return tItem(k); })}];

}
function treeHTML(area, filter, mobile){
  var groups = tree(area), f = filter.trim().toLowerCase(), cur = currentId(), out = "", any = false;
  groups.forEach(function(g){
    var items = g.items.filter(visible).filter(function(it){ return !f || it.label.toLowerCase().indexOf(f) > -1 || t(it.label).toLowerCase().indexOf(f) > -1; });
    if (g.later && !S.later) return;
    if (!items.length && !(g.emptyNote && !f)) return;
    any = true;
    out += '<div class="tgroup">';
    if (g.title) out += '<div class="gtitle">' + esc(t(g.title)) + (g.later ? ' <span class="badge-later">' + t("later") + '</span>' : '') + '</div>';
    if (!items.length) out += '<p class="pnote">' + esc(g.emptyNote) + '</p>';

      var lbl = it.raw ? esc(it.label) : esc(t(it.label)) + (it.suffix ? esc(it.suffix) : "");

function render(){

  var ctx = r.scope === "global" ? "global" : r.tenant;
  var admin = S.role === "admin";
  document.documentElement.setAttribute("data-theme", S.theme);
  document.documentElement.lang = S.lang;
  var app = $("app");
  app.setAttribute("data-ctx", ctx);
  app.classList.toggle("pinned", S.pinned);
  app.classList.toggle("overlay", !S.pinned && S.overlay);

  /* tenant switches (rail + mobile header) */
  document.querySelectorAll('[data-act=tenant]').forEach(function(b){
    var tn = b.getAttribute("data-t"), on = tn === S.tenant, lk = b.querySelector(".lk");
    b.setAttribute("aria-pressed", on);
    lk.hidden = !S.ro[tn];
    b.setAttribute("aria-label", TN[tn] + " tenant" + (S.ro[tn] ? ", read-only" : "") + (on ? ", current" : ", switch to it"));
    if (b.closest(".tchip")) b.setAttribute("data-tip", on ? "You are in " + TN[tn] + (S.ro[tn] ? " (read-only)" : "") : "Switch to " + TN[tn] + (S.ro[tn] ? " (read-only)" : "") + " — same screen");
  });
  $("tword").textContent = TN[S.tenant];

  /* rail */
  var panelShown = S.pinned || S.overlay;
  document.querySelectorAll("#rail .ritem").forEach(function(b){
    var a = b.getAttribute("data-area");
    b.hidden = (b.hasAttribute("data-later") && !S.later) || (b.hasAttribute("data-admin") && !admin);
    b.classList.toggle("here", a === area);
    if (b.getAttribute("data-act") === "area") b.setAttribute("aria-expanded", panelShown && S.panelArea === a);
    var rl = b.querySelector(".rl[data-l]"); if (rl) rl.textContent = t(rl.getAttribute("data-l"));

  });
  $("avLetter").textContent = admin ? "A" : "F";
  $("avName").textContent = admin ? "admin" : "fred";
  $("avatarBtn").setAttribute("aria-label", "Account: " + (admin ? "admin" : "fred"));
  $("avatarBtn").setAttribute("aria-expanded", S.acct);

  /* panel */

  $("ph").innerHTML = '<div><div class="ptitle">' + esc(t(AREAS[pa])) + '</div><div class="psub">' + scopeLine(pa) + '</div></div>' +

              : '<button type="button" class="iconbtn" data-act="pin" title="Pin panel open  [" aria-label="Pin panel open"><svg class="i s" viewBox="0 0 24 24"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"/></svg></button>');
  $("pfw").hidden = !(pa === "master" || pa === "ops");
  $("pfilter").placeholder = t("Filter…");
  $("ptree").innerHTML = treeHTML(pa, S.filter, false);
  $("ptree").setAttribute("aria-label", t(AREAS[pa]));

  /* top header */
  $("brand").setAttribute("href", "#/" + S.tenant + "/overview");
  var tp = $("tpill");
  tp.className = "tpill " + ctx;
  tp.textContent = ctx === "global" ? "Global" : TN[ctx] + (S.ro[ctx] ? " · read-only" : "");
  var crumbs = sc ? (sc.key === "overview" ? ["Overview"] : [AREAS[area === "admin" && r.scope === "global" ? "admin" : sc.area]].concat(sc.group ? [sc.group] : []).concat([sc.label]).concat(sc.detail ? [sc.detail] : [])) : ["Not found"];
  if (sc && (sc.area === "help")) crumbs = ["Help"];

    '<div class="robanner" role="status"><span aria-hidden="true">🔒</span><span><b>' + TN[r.tenant] + ' is read-only</b> — business changes are blocked. Reading, audit, preferences and user management still work.</span>' + (admin ? '<a href="' + gHref("tenants") + '">Change on Tenants</a>' : '') + '</div>' : "";

  /* page */
  var html;

  renderMobile(area);
  renderAcct();
  renderControls();
}

function moreHTML(){
  var admin = S.role === "admin", out = "";
  function grp(title, area){ var h = treeHTML(area, "", true); return '<div class="tgroup"><div class="gtitle">' + esc(t(title)) + (area !== "admin" ? ' <span class="badge-later">' + t("later") + '</span>' : '') + '</div>' + h.replace(/<div class="tgroup">|<\/div>$/g, "") + '</div>'; }
  if (S.later) { out += grp("Planning", "planning") + grp("Reports", "reports"); }
  if (admin) out += grp("Admin", "admin");
  var cur = currentId();
  function li(label, href, id){ return '<li><a class="titem" href="' + href + '"' + (cur.id === id ? ' aria-current="page"' : '') + '><span class="tl">' + esc(t(label)) + '</span><svg class="i s chev" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a></li>'; }
  out += '<div class="tgroup"><div class="gtitle">' + t("Account") + ' · ' + (admin ? "admin" : "fred") + '</div><ul role="list">' + li("Help", gHref("help"), "g:help") + li("API tokens", gHref("api-tokens"), "g:api-tokens") + '</ul>' +
    '<div class="prow" style="padding:8px 10px">' + t("Language") + segHTML("lang", [["en","English"],["pl","Polski"]], S.lang) + '</div>' +
    '<div class="prow" style="padding:4px 10px 8px">' + t("Theme") + segHTML("theme", [["light",t("Light")],["dark",t("Dark")]], S.theme) + '</div>' +
    '<ul role="list"><li><button type="button" class="titem mitem" data-act="signout"><span class="tl">' + t("Sign out") + '</span></button></li></ul></div>';
  return out;
}
function segHTML(kind, opts, val){ return '<div class="seg" role="group">' + opts.map(function(o){ return '<button type="button" data-act="' + kind + '" data-v="' + o[0] + '" aria-pressed="' + (o[0] === val) + '">' + esc(o[1]) + '</button>'; }).join("") + '</div>'; }
function renderAcct(){
  var p = $("acct"), admin = S.role === "admin";
  p.hidden = !S.acct;
  if (!S.acct) return;
  p.innerHTML = '<div class="who"><span class="av2">' + (admin ? "A" : "F") + '</span><div><b>' + (admin ? "admin" : "fred") + '</b><div class="muted" style="font-size:12px">' + (admin ? "Admin" : "User") + ' · signed in</div></div></div>' +
    '<div class="prow">' + t("Language") + segHTML("lang", [["en","English"],["pl","Polski"]], S.lang) + '</div>' +
    '<div class="prow">' + t("Theme") + segHTML("theme", [["light",t("Light")],["dark",t("Dark")]], S.theme) + '</div>' +
    '<div style="border-top:1px solid var(--border);padding-top:6px"><a class="mitem" href="' + gHref("api-tokens") + '">🔑 ' + t("API tokens") + '</a><button type="button" class="mitem" data-act="signout">↪ ' + t("Sign out") + '</button></div>';
}
function renderControls(){
  document.querySelectorAll('[data-ctl=role]').forEach(function(i){ i.checked = i.value === S.role; });
  document.querySelector('[data-ctl=later]').checked = S.later;
  document.querySelector('[data-ctl=ro-test]').checked = !!S.ro.test;
  document.querySelector('[data-ctl=ro-prod]').checked = !!S.ro.prod;
  document.querySelector('[data-ctl=pinned]').checked = S.pinned;
  $("mcb").hidden = !S.mcOpen;
  $("mc").classList.toggle("closed", !S.mcOpen);
  document.querySelector('[data-act=mc]').setAttribute("aria-expanded", S.mcOpen);
  $("mcArrow").textContent = S.mcOpen ? "▾" : "▸";
}

/* ================= behaviour ================= */
var toastTimer;
function toast(msg){ var el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, 2600); }
function switchTenant(tn){
  if (tn === S.tenant) { toast("You are already in " + TN[tn]); return; }
  S.tenant = tn; lsSet("tenant", tn);
  var r = parse();
  if (r && r.scope === "tenant") { location.hash = "#/" + tn + "/" + r.path; }
  else { render(); toast(TN[tn] + " selected — this page is shared by Test and Prod, so it does not change."); }
}
function setRO(tn, v){
  S.ro[tn] = v; lsSet("ro", S.ro); render();
  toast(TN[tn] + (v ? " is now read-only" : " is writable again"));
}
function onRoute(){
  var r = parse();
  if (!r) { location.replace("#/" + S.tenant + "/overview"); return; }
  var sc = screenOf(r);
  if (sc && sc.later && !S.later) { location.replace("#/" + r.tenant + "/overview"); return; }
  if (r.scope === "tenant" && r.tenant !== S.tenant) { S.tenant = r.tenant; lsSet("tenant", S.tenant); }
  var area = areaOf(r, sc);
  if (PANEL_AREAS.indexOf(area) > -1 && (S.panelArea !== area)) { S.panelArea = area; S.filter = ""; $("pfilter").value = ""; }
  S.overlay = false; S.sheet = null; S.acct = false; S.shFilter = ""; $("shfilter").value = "";
  if (sc && r.path !== "overview") {
    var label = sc.detail ? sc.detail + " " + (MATERIALS.filter(function(m){ return m.id === sc.detail; })[0] || {name:""}).name : sc.label;
    var href = location.hash;
    S.recent = [{label:label, href:href, tag: r.scope === "global" ? "global" : TN[r.tenant]}].concat(S.recent.filter(function(x){ return x.href !== href; })).slice(0, 8);
    lsSet("recent", S.recent);
  }
  render();
  window.scrollTo(0, 0);
  var h = document.querySelector("#page h1"); if (h && document.activeElement && document.activeElement.closest && document.activeElement.closest(".panel,.sheet,.tabbar,.popover,#page")) h.focus({preventScroll:true});
}
window.addEventListener("hashchange", onRoute);

document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]");
  // click outside overlay / popover closes them
  if (S.overlay && !e.target.closest("#panel") && !e.target.closest("#rail")) { S.overlay = false; render(); }
  if (S.acct && !e.target.closest("#acct") && !e.target.closest("#avatarBtn")) { S.acct = false; render(); }
  // following a link to the page you are already on still closes the overlay / sheet / popover
  var link = e.target.closest("a[href^='#/']");
  if (link && link.getAttribute("href") === location.hash && (S.overlay || S.sheet || S.acct)) { S.overlay = false; S.sheet = null; S.acct = false; render(); }
  if (!el) return;
  var act = el.getAttribute("data-act");
  switch (act) {
    case "tenant": switchTenant(el.getAttribute("data-t")); break;
    case "home": S.panelArea = "home"; S.filter = ""; $("pfilter").value = ""; go("#/" + S.tenant + "/overview"); break;
    case "help": go(gHref("help")); break;
    case "area":
      var a = el.getAttribute("data-area");
      if (S.pinned) { if (S.panelArea !== a) { S.panelArea = a; S.filter = ""; $("pfilter").value = ""; } }
      else { S.overlay = !(S.overlay && S.panelArea === a); if (S.panelArea !== a) { S.filter = ""; $("pfilter").value = ""; } S.panelArea = a; }
      render();
      if (S.pinned || S.overlay) { var first = $("pfw").hidden ? document.querySelector("#ptree a") : null; if (first && e.detail === 0) first.focus(); }
      break;
    case "pin": S.pinned = !S.pinned; S.overlay = false; lsSet("pinned", S.pinned); render(); toast(S.pinned ? "Panel pinned open" : "Panel collapsed — click a rail icon to show it on top"); break;
    case "acct": S.acct = !S.acct; render(); break;
    case "lang": S.lang = el.getAttribute("data-v"); lsSet("lang", S.lang); render(); if (S.lang === "pl") toast("Polski: menu labels switch to Polish (pages stay English in this mockup)."); break;
    case "theme": S.theme = el.getAttribute("data-v"); lsSet("theme", S.theme); render(); break;
    case "signout": S.acct = false; S.sheet = null; render(); toast("Signed out (mockup) — you would land on the sign-in page."); break;
    case "toast": e.preventDefault(); toast(el.getAttribute("data-msg")); break;
    case "ro": setRO(el.getAttribute("data-t"), !S.ro[el.getAttribute("data-t")]); break;
    case "tab":
      var tb = el.getAttribute("data-tab");
      if (tb === "home") { S.sheet = null; go("#/" + S.tenant + "/overview"); }
      else { S.sheet = S.sheet === tb ? null : tb; S.shFilter = ""; $("shfilter").value = ""; render(); }
      break;
    case "closesheet": S.sheet = null; render(); break;
    case "mc": S.mcOpen = !S.mcOpen; lsSet("mcOpen", S.mcOpen); renderControls(); break;
    case "about": openAbout(); break;
    case "closeabout": $("about").hidden = true; break;
    case "reset": Object.keys(localStorage).forEach(function(k){ if (k.indexOf(LS) === 0) localStorage.removeItem(k); }); location.hash = "#/test/overview"; location.reload(); break;
  }
});
document.addEventListener("change", function(e){
  var c = e.target.getAttribute("data-ctl"); if (!c) return;
  if (c === "role") { S.role = e.target.value; lsSet("role", S.role); if (S.role !== "admin" && S.panelArea === "admin") S.panelArea = "home"; render(); toast(S.role === "admin" ? "Signed in as admin" : "Signed in as fred (normal user) — Admin and Import disappear"); }
  if (c === "later") { S.later = e.target.checked; lsSet("later", S.later); if (!S.later && ["ops","planning","reports"].indexOf(S.panelArea) > -1) S.panelArea = "home"; var sc = screenOf(parse()); if (sc && sc.later && !S.later) location.hash = "#/" + S.tenant + "/overview"; else render(); }
  if (c === "ro-test") setRO("test", e.target.checked);
  if (c === "ro-prod") setRO("prod", e.target.checked);
  if (c === "pinned") { S.pinned = e.target.checked; S.overlay = false; lsSet("pinned", S.pinned); render(); }
});
$("pfilter").addEventListener("input", function(e){ S.filter = e.target.value; $("ptree").innerHTML = treeHTML(S.panelArea, S.filter, false); });
$("shfilter").addEventListener("input", function(e){ S.shFilter = e.target.value; $("shTree").innerHTML = treeHTML(S.sheet, S.shFilter, true); });
// Enter in a filter box opens the first match
["pfilter","shfilter"].forEach(function(id){ $(id).addEventListener("keydown", function(e){ if (e.key !== "Enter") return; var a = document.querySelector((id === "pfilter" ? "#ptree" : "#shTree") + " a.titem"); if (a) { e.preventDefault(); location.hash = a.getAttribute("href"); } }); });
$("about").addEventListener("click", function(e){ if (e.target === $("about")) $("about").hidden = true; });
document.addEventListener("keydown", function(e){
  var typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if (e.key === "Escape") {
    if (typing && document.activeElement.value) { document.activeElement.value = ""; document.activeElement.dispatchEvent(new Event("input")); return; }
    if (!$("about").hidden) { $("about").hidden = true; return; }
    if (S.acct || S.overlay || S.sheet) { var wasSheet = S.sheet; S.acct = false; S.overlay = false; S.sheet = null; render(); var b = wasSheet ? document.querySelector('.tab[data-tab="' + wasSheet + '"]') : document.querySelector('#rail [data-area="' + S.panelArea + '"]'); if (b) b.focus(); }
    return;
  }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "[") { e.preventDefault(); S.pinned = !S.pinned; S.overlay = false; lsSet("pinned", S.pinned); render(); }
  if (e.key === "/") { if (window.innerWidth <= 767) return; e.preventDefault(); if (!S.pinned) S.overlay = true; if (S.panelArea !== "master" && S.panelArea !== "ops") S.panelArea = "master"; render(); $("pfilter").focus(); }
});

/* ================= about ================= */
function openAbout(){
  $("aboutDlg").innerHTML = '<div class="h1row"><h2 id="aboutTitle">05 — Icon rail + contextual panel</h2><button type="button" class="iconbtn" data-act="closeabout" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>' +
    '<h3>The idea</h3><p>Two levels, both visible — like Linear or VS Code. A slim labelled <b>icon rail</b> holds the seven areas; clicking one opens its tree in a 240 px <b>panel</b> next to it (with record counts and a filter). The tenant is not a banner but an <b>ambient colour</b>: the whole rail is amber in Test and black with a red edge in Prod, and the T / P chip at its top flips tenant on the same screen. On a phone the rail becomes <b>bottom tabs</b> whose menus open as full-screen lists.</p>' +
    '<h3>Why it fits CPG</h3><ul><li>Master data — the part that exists today and that people use all day — is one tree with counts, so siblings are one click apart once the panel shows it.</li><li>The rail scales to slices 2–3 without growing a long top bar; later areas just add a panel, not new top-level links.</li><li>You cannot forget you are in Prod: the colour is in your peripheral vision on every screen, and grey on shared pages tells you the switch does not apply there.</li></ul>' +
    '<h3>Trade-offs</h3><ul><li>Costs ~300 px of width when pinned; collapsing gives it back but makes the tree a two-step overlay.</li><li>Icons need their labels — 10–11 px labels are small, and Polish ones wrap to two lines (try Account → Polski).</li><li>Two places to look (rail + panel) is one more concept than a single sidebar; the admin\'s Global audit sits under Admin, not Audit.</li><li>Strong amber may feel loud for people who live in Test all day.</li></ul>' +
    '<h3>Click counts (from a tenant’s Overview)</h3>' +
    '<div class="tw"><table><thead><tr><th>Target</th><th>Desktop</th><th>Mobile (390 px)</th></tr></thead><tbody>' +
    '<tr><td>Materials</td><td>2 — Master data → Materials</td><td>2 — Master data tab → Materials</td></tr>' +
    '<tr><td>Locations</td><td>2 — Master data → Locations (1 if the Master data panel is already open)</td><td>2 — Master data tab → Locations</td></tr>' +
    '<tr><td>Safety stock</td><td>2 — Master data → Safety stock</td><td>2 — Master data tab → Safety stock</td></tr>' +
    '<tr><td>Users</td><td>2 — Admin → Users</td><td>2 — More → Users</td></tr>' +
    '<tr><td>Switch Test → Prod, same screen</td><td>1 — P on the rail</td><td>1 — Prod in the header</td></tr>' +
    '<tr><td>Change language</td><td>2 — avatar → Polski</td><td>2 — More → Polski</td></tr>' +
    '<tr><td>Reach the Import</td><td>2 — Master data → Import</td><td>2 — Master data tab → Import</td></tr>' +
    '</tbody></table></div><p class="muted" style="font-size:12.5px">Panel collapsed: same counts — the rail click opens the panel on top instead of beside the page.</p>';
  $("about").hidden = false;
  $("aboutDlg").focus();
}

/* ================= boot ================= */
onRoute(); // syncs the tenant from the URL (a shared #/prod/… link opens in Prod), picks the panel, renders
})();
</script>
</body>
</html>
