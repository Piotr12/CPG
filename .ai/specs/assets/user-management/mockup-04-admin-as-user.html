<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mockup — /admin as a normal user</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:#fff;color:#252525}

main{max-width:768px;margin:0 auto;padding:56px 24px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between}

.btn{height:32px;padding:0 12px;border:1px solid #e5e5e5;border-radius:8px;display:inline-flex;align-items:center;color:#252525;font-weight:500;font-size:14px;background:#fff}
.primary{background:#252525;color:#fff;border-color:#252525}
.link{color:#252525;font-weight:500;text-decoration:underline;text-underline-offset:3px}
.card{border:1px solid #e8e8e8;border-radius:14px;padding:20px}.t{font-weight:600}.d{font-family:ui-monospace,monospace;font-size:13px;color:#737373;margin:4px 0 14px}
.b{display:inline-block;font-size:12px;border:1px solid #e5e5e5;border-radius:999px;padding:2px 8px;margin-right:6px}
.sec{background:#f4f4f5;border-color:#f4f4f5}.muted{color:#737373;font-size:14px;margin:0}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;color:#737373;font-weight:500;padding:10px 12px;border-bottom:1px solid #e8e8e8}
td{padding:12px;border-bottom:1px solid #f0f0f0}.dots{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #e5e5e5;color:#737373}
.menu{position:absolute;left:calc(50% + 170px);top:286px;width:190px;border:1px solid #e5e5e5;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:4px;font-size:14px}
.menu div{padding:8px 10px;border-radius:6px}.menu .hl{background:#f4f4f5}.danger{color:#c0362c}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.dlg{width:420px;background:#fff;border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg h2{margin:0;font-size:18px}.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500}
.in{height:36px;border:1px solid #e5e5e5;border-radius:8px;padding:0 10px;display:flex;align-items:center;font-weight:400}
.err{color:#c0362c;font-size:13px;font-weight:400}.inerr{border-color:#c0362c}.row{display:flex;justify-content:flex-end;gap:8px}
.hint{font-size:12px;color:#8a8a8a}</style></head><body>
