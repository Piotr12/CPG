<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mockup — /admin mobile</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:#fff;color:#252525;min-height:100vh;display:flex;flex-direction:column}
.note{position:fixed;bottom:6px;right:12px;font-size:11px;color:#8a8a8a;font-family:ui-monospace,monospace}
header{display:flex;align-items:center;gap:16px;height:48px;padding:0 24px;border-bottom:1px solid #e8e8e8;font-size:14px}
.brand{font-weight:600;color:#252525;text-decoration:none;margin-right:8px}
nav ul{display:flex;gap:4px;list-style:none;margin:0;padding:0}nav a{display:block;padding:6px 8px;border-radius:6px;color:#737373;text-decoration:none}
nav a[aria-current]{color:#252525;text-decoration:underline;text-underline-offset:6px}
.acct{margin-left:auto;display:flex;align-items:center;gap:6px;border:1px solid #e5e5e5;border-radius:8px;padding:5px 10px;background:#fff}
.strip{display:flex;align-items:center;justify-content:space-between;padding:8px 24px;border-bottom:1px solid #e8e8e8;background:#f4f4f5;font-size:14px;color:#555}
.tag{font-weight:700;letter-spacing:.08em;font-size:12px;background:#e4e4e7;padding:3px 8px;border-radius:4px;margin-right:10px;color:#252525}
.seg{border:1px solid #e0e0e0;border-radius:8px;display:inline-flex;background:#fff;padding:2px}.seg span{padding:4px 10px;border-radius:6px}.seg .on{background:#f0f0f0;font-weight:600}
main{max-width:768px;width:100%;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:24px;flex:1}
h1{font-size:24px;margin:0}.card{border:1px solid;border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:4px}
.muted{color:#737373;font-size:14px}footer{padding:16px 24px 24px;text-align:center;font-size:12px;color:#737373}footer a{color:inherit}
.pop{position:absolute;right:24px;top:52px;width:300px;border:1px solid #e5e5e5;border-radius:10px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:14px;display:flex;flex-direction:column;gap:12px;font-size:14px}
.btn{border:1px solid #e5e5e5;border-radius:8px;padding:6px 12px;background:#fff;font-size:13px;align-self:flex-start}
.cta{display:inline-block;background:#18181b;color:#fff;border-radius:8px;padding:10px 18px;font-weight:500;text-decoration:none;align-self:flex-start}
header{padding:0 16px}.menu{margin-left:auto;border:1px solid #e5e5e5;border-radius:8px;padding:5px 10px;background:#fff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4)}.sheet{position:fixed;top:0;right:0;bottom:0;width:300px;background:#fff;border-left:1px solid #e5e5e5;padding:18px;display:flex;flex-direction:column;gap:14px;font-size:15px}
.sheet ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}.sheet li a{display:flex;align-items:center;min-height:44px;padding:0 10px;border-radius:8px;color:#252525}.sheet li a[aria-current]{background:#f4f4f5;font-weight:600}
.x{position:absolute;right:16px;top:16px;color:#737373}hr{border:0;border-top:1px solid #eee;width:100%;margin:0}</style></head><body>
<header><a class="brand">🦣 CPG</a><span class="menu">☰ Menu</span></header>
<div class="strip" style="padding:8px 16px"><div><span class="tag">GLOBAL</span></div><div class="seg"><span>Test</span><span>Prod</span></div></div>
<main style="padding:32px 16px"><h1>Cave control</h1><div class="card" style="border-color:#f59e0b;background:#fffbeb"><b>Test</b><span class="muted">Demonstration data</span></div></main>
<div class="scrim"></div><div class="sheet"><b style="font-size:17px">Menu</b><span class="x">✕</span>
<nav aria-label="Menu"><ul><li><a aria-current="page">Tenants</a></li><li><a>Test</a></li><li><a>Prod</a></li><li><a>Audit</a></li><li><a>API tokens</a></li><li><a>Users</a></li><li><a>Help</a></li></ul></nav><hr>
<div class="muted">Signed in as <b style="color:#252525">admin</b></div><div style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px"><span class="seg"><span class="on">English</span><span>Polski</span></span><span class="seg"><span class="on">Light</span><span>Dark</span></span></div><span class="btn">Sign out</span></div>
<div class="note" style="z-index:2">MOCKUP · 360 px · Escape closes, focus returns to Menu</div></body></html>
