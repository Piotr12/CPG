<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mockup — /login</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;background:#fff;color:#252525;display:flex;min-height:100vh;align-items:center;justify-content:center}
